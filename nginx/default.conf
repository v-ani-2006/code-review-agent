# ==============================================================================
# nginx/default.conf — Virtual host for CodePilot AI reverse proxy
# ==============================================================================

upstream codepilot_backend {
    # Round-robin to the backend service (Docker service name = 'backend')
    server backend:8000;
    keepalive 32;
}

# ==============================================================================
# HTTP server — redirects to HTTPS in production; used as-is in development
# ==============================================================================
server {
    listen 80;
    server_name _;   # Match any hostname; replace with your domain in production

    # ============================================================
    # Security headers
    # ============================================================
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================================
    # Upload size limit (must match nginx.conf client_max_body_size)
    # ============================================================
    client_max_body_size 50m;

    # ============================================================
    # Timeouts
    # ============================================================
    proxy_connect_timeout  60s;
    proxy_send_timeout     120s;
    proxy_read_timeout     120s;

    # ============================================================
    # Common proxy headers (forwarded to FastAPI)
    # ============================================================
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_http_version  1.1;
    proxy_set_header    Connection      "";

    # ============================================================
    # Root — forward to FastAPI (welcome response)
    # ============================================================
    location = / {
        proxy_pass http://codepilot_backend;
    }

    # ============================================================
    # Health check — used by Docker and load balancers
    # ============================================================
    location = /health {
        proxy_pass http://codepilot_backend/health;
        access_log  off;   # Silence noisy health poll logs
    }

    # ============================================================
    # API — rate-limited
    # ============================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://codepilot_backend;
    }

    # ============================================================
    # Auth endpoints — stricter rate limit to protect login
    # ============================================================
    location /auth/ {
        limit_req zone=login_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://codepilot_backend;
    }

    # ============================================================
    # Swagger UI — configurable disable in production via env
    # ============================================================
    location /docs {
        proxy_pass http://codepilot_backend/docs;
    }

    location /redoc {
        proxy_pass http://codepilot_backend/redoc;
    }

    location /openapi.json {
        proxy_pass http://codepilot_backend/openapi.json;
    }

    # ============================================================
    # Metrics endpoint (Prometheus scraper)
    # ============================================================
    location /metrics {
        # Restrict to internal networks only in production:
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://codepilot_backend/metrics;
    }

    # ============================================================
    # Uploads — serve static upload files directly from volume
    # ============================================================
    location /uploads/ {
        alias /app/uploads/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        # Security: prevent executing scripts from upload directory
        location ~* \.(php|py|sh|pl|cgi)$ {
            deny all;
        }
    }

    # ============================================================
    # Reports — serve generated reports directly from volume
    # ============================================================
    location /reports/ {
        alias /app/reports/;
        expires 1h;
        add_header Cache-Control "public";
        add_header Content-Disposition "attachment";
    }

    # ============================================================
    # All other routes — forward to FastAPI backend
    # ============================================================
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://codepilot_backend;
    }

    # ============================================================
    # Error pages
    # ============================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        return 503 '{"detail": "Service temporarily unavailable. Please try again later.", "status": 503}';
        add_header Content-Type application/json;
    }
}
