[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "A production-grade FastAPI backend service for an AI-powered code review agent"
readme = "README.md"
authors = [
    { name = "CodePilot AI Team", email = "dev@codepilot.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "greenlet>=3.0.3",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0.post1",
    "radon>=6.0.1",
    "pygments>=2.17.2",
    "google-genai>=0.1.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "orjson>=3.9.15",
    "jinja2>=3.1.3",
    "markdown>=3.6",
    "aiofiles>=23.2.1",
    "redis>=5.0.0",
    "fastapi-limiter>=0.1.6",
    "slowapi>=0.1.9",
    "limits>=3.10.0",
    "prometheus-client>=0.20.0",
    "gunicorn>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
    "isort>=5.13.2",
    "bandit>=1.7.8",
    "safety>=3.1.0",
    "pre-commit>=3.6.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "faker>=24.0.0",
    "factory-boy>=3.3.0",
    "pytest-mock>=3.14.0",
    "types-redis>=4.6.0.20240218",
    "types-python-dateutil>=2.9.0.20260807",
    "types-requests>=2.31.0.20240125",
]

# --- Black Code Formatter Configuration ---------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories to exclude
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.pytest_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | alembic/versions
  | uploads
  | reports
)/
'''

# --- isort Import Sorter Configuration ----------------------------------------
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".git",
    "venv",
    ".venv",
    "alembic/versions",
    "build",
    "dist",
    "uploads",
    "reports",
]
known_first_party = ["app"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# --- Coverage Analysis Configuration ------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 40
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"
