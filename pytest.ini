[pytest]
pythonpath = .
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Isolated unit tests without external network or DB calls
    integration: Full-stack integration tests against API endpoints and database
    performance: Benchmark and latency tests for reviews, caching, and batch tasks
    security: Authentication, authorization, rate limiting, and exploit rejection tests
    slow: Long-running or heavy load tests

addopts =
    -v
    --strict-markers
    --tb=short
    -p no:warnings

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
