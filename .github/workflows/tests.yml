# ==============================================================================
# .github/workflows/tests.yml — Granular Test Matrix & Coverage Reporting
# CodePilot AI — Phase 13 DevOps Toolchain
# ==============================================================================

name: Test Suites

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "tests/**"
      - "alembic/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Target test suite to execute"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - security
          - performance

jobs:
  test-suite:
    name: "Run Tests (${{ matrix.suite }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, security, performance]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codepilot_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: codepilot_test_db
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres_password
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-minimum-32-characters-for-ci-pipeline
          DEBUG: "false"
        run: |
          alembic upgrade head

      - name: Run ${{ matrix.suite }} Tests
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: codepilot_test_db
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres_password
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-minimum-32-characters-for-ci-pipeline
          DEBUG: "false"
        run: |
          pytest tests/${{ matrix.suite }} -v -m ${{ matrix.suite }} --cov=app --cov-report=xml:coverage-${{ matrix.suite }}.xml

      - name: Upload ${{ matrix.suite }} Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage-${{ matrix.suite }}.xml
          retention-days: 7
