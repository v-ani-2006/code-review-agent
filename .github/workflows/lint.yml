# ==============================================================================
# .github/workflows/lint.yml — Dedicated Code Quality & Linter Automation
# CodePilot AI — Phase 13 DevOps Toolchain
# ==============================================================================

name: Code Linting & Style

on:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "tests/**"
      - "*.py"
      - "*.toml"
      - "*.ini"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Linting Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy types-redis types-python-dateutil types-requests

      - name: Create Reports Directory
        run: mkdir -p lint_reports

      - name: Check Ruff Linting
        id: ruff
        run: |
          ruff check . --output-format=text | tee lint_reports/ruff_report.txt

      - name: Check Black Formatting
        id: black
        run: |
          black --check --diff . | tee lint_reports/black_report.txt

      - name: Check isort Import Sorting
        id: isort
        run: |
          isort --check-only --diff . | tee lint_reports/isort_report.txt

      - name: Check MyPy Static Typing
        id: mypy
        run: |
          mypy app --config-file=mypy.ini | tee lint_reports/mypy_report.txt

      - name: Upload Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-failure-reports
          path: lint_reports/
          retention-days: 7
