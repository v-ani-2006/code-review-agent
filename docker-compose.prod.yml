# ==============================================================================
# docker-compose.prod.yml — Production environment overlay
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.yml logs -f backend
# ==============================================================================

# ==============================================================================
# Named volumes for persistent data — all use local driver for VPS compatibility
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  reports_data:
    driver: local
  logs_data:
    driver: local
  backups_data:
    driver: local

# ==============================================================================
# Isolated Docker network
# ==============================================================================
networks:
  codepilot_net:
    driver: bridge

# ==============================================================================
# Production services
# ==============================================================================
services:

  # ============================================================================
  # PostgreSQL — production configuration
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: codepilot_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups_data:/backups
    # Do NOT expose port to host in production — only reachable via Docker network
    expose:
      - "5432"
    networks:
      - codepilot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis — production configuration
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: codepilot_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --save 300 10
      --loglevel notice
    volumes:
      - redis_data:/data
    # Internal only — not exposed to host
    expose:
      - "6379"
    networks:
      - codepilot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Backend — production: Gunicorn multi-worker, no bind mounts
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: codepilot_backend
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_URL: ""
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DEBUG: "false"
      WORKERS: ${WORKERS:-4}
      PYTHONPATH: /app
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports
      - logs_data:/app/logs
      - backups_data:/app/backups
    # Internal only — Nginx is the sole external entry point
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codepilot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Nginx — production: TLS-ready, strict security headers, read-only config
  # ============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: codepilot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/mime.types:/etc/nginx/mime.types:ro
      - uploads_data:/app/uploads:ro
      - reports_data:/app/reports:ro
      - logs_data:/var/log/nginx
      # Uncomment for TLS:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - codepilot_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
